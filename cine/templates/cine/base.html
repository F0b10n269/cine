{% load static %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CineHoy{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'cine/catalog.css' %}">
</head>
<body>
    <header class="site-header">
        <a class="wordmark" href="{% url 'movie_list' %}" aria-label="Cine, inicio">
            CINE<span>HOY</span>
        </a>
        <nav class="header-label" aria-label="Ubicación de la programación">PROGRAMACIÓN <i></i> SANTIAGO</nav>
        <a class="admin-link" href="/admin/">Administración</a>
    </header>
    <main class="page-shell">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
